<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B5E3B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Jurnal Tani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F5F3; --surface:#FFFFFF; --ink:#10231A; --muted:#566860; --line:#D5DFD8; --mint:#E3EFE7;
  --accent:#1B5E3B; --on-accent:#FFFFFF; --leaf:#C8DB4B;
  --good:#1F7A46; --ok:#34698C; --warn:#94620A; --bad:#B3261E;
  --sans:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Literata",Georgia,"Times New Roman",serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0E1712; --surface:#16231C; --ink:#E8F0EA; --muted:#9BAFA3; --line:#293A2F; --mint:#1B2C22;
    --accent:#6CC795; --on-accent:#0E1712;
    --good:#5FC58A; --ok:#7DB3D6; --warn:#E0B04A; --bad:#F08A80;
  }
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:96px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--sans);
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 110px}

header.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px;color:var(--accent)}
#install{display:none;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:6px 14px;font-weight:500;font-size:14px;cursor:pointer}

.searchbar{position:sticky;top:0;z-index:5;background:var(--paper);padding:8px 0 10px}
form.s{display:flex;gap:8px}
.field{position:relative;flex:1;min-width:0}
.field svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.field input{width:100%;height:52px;font:400 16px var(--sans);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:0 44px 0 44px}
.field input:focus{border-color:var(--accent)}
#clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:transparent;color:var(--muted);font-size:22px;cursor:pointer;border-radius:50%}
button.go{flex:none;height:52px;background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:0 22px;font-weight:700;font-size:16px;cursor:pointer}
button.go:disabled{opacity:.6}

.hero{padding:22px 0 6px}
.hero h1{font:700 clamp(28px,8vw,40px)/1.08 var(--sans);letter-spacing:-.02em;margin:0 0 10px}
.lede{margin:0 0 14px;color:var(--muted);font-size:16px;max-width:34em}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;list-style:none;margin:0;padding:0;font-size:14px}
.legend li{display:flex;align-items:center;gap:7px}
.legend i{display:block;width:5px;height:16px;border-radius:3px}
h2.sec{display:flex;align-items:center;justify-content:space-between;font:700 17px var(--sans);margin:26px 0 10px}
h2.sec button{border:0;background:none;color:var(--muted);font-size:14px;font-weight:400;cursor:pointer;padding:4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{text-align:left;background:var(--mint);border:0;border-radius:16px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:78px}
.tile:active{filter:brightness(.95)}
.tile b{font-weight:700;font-size:16px;line-height:1.2}
.tile span{color:var(--muted);font-size:13.5px;line-height:1.3}
.hist{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer}

.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 6px}
.count{color:var(--muted);font-size:14px}
.fbtn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;cursor:pointer}
.sorts{display:flex;gap:6px;margin:0 0 6px;overflow-x:auto;scrollbar-width:none}
.sorts::-webkit-scrollbar{display:none}
.sorts button{flex:none;border:0;background:transparent;border-radius:999px;padding:7px 13px;font-size:14px;color:var(--muted);cursor:pointer}
.sorts button[aria-pressed=true]{background:var(--mint);color:var(--ink);font-weight:700}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--mint);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.banner button{flex:none;border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer;padding:4px 6px}
.err{border:1px solid var(--bad);color:var(--bad);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
.empty{color:var(--muted);padding:26px 0}
.spin{color:var(--muted);padding:20px 0;text-align:center}

article.res{--rail:var(--line);border-left:5px solid var(--rail);padding:14px 0 14px 14px;border-bottom:1px solid var(--line)}
article.res.good{--rail:var(--good)} article.res.ok{--rail:var(--ok)}
article.res.warn{--rail:var(--warn)} article.res.bad{--rail:var(--bad)}
article.res h3{margin:0 0 5px;font:600 18px/1.3 var(--serif)}
article.res h3 button{all:unset;cursor:pointer;display:block}
article.res h3 button:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.meta{margin:0 0 6px;font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:0 12px}
.meta i{font-family:var(--serif)}
.status{margin:0 0 10px;font-size:14px;display:flex;flex-wrap:wrap;align-items:center;gap:2px 12px}
.status b{font-weight:700}
.good .status b{color:var(--good)} .ok .status b{color:var(--ok)} .warn .status b{color:var(--warn)} .bad .status b{color:var(--bad)}
.status span{color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts button,.acts a{font:500 14px var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.acts .on{background:var(--mint);border-color:var(--accent);color:var(--accent)}
button.more-btn{display:block;margin:20px auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:11px 22px;font-weight:500;font-size:15px;cursor:pointer}

nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px)}
nav.bottom button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:6px;font-size:13px;color:var(--muted);cursor:pointer;border-radius:12px}
nav.bottom button[aria-selected=true]{color:var(--accent);font-weight:700}

#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:640px;margin:0 auto;max-height:88vh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateY(100%);transition:transform .18s ease-out;overscroll-behavior:contain}
#sheet.up{transform:translateY(0)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sh-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sh-h h2{margin:0;font:700 20px var(--sans)}
.x{border:0;background:none;color:var(--muted);font-size:15px;cursor:pointer;padding:6px}
#sheet h4{font:700 15px var(--sans);margin:18px 0 6px}
.dt{font:600 20px/1.3 var(--serif);margin:4px 0 6px}
.tr{border-left:5px solid var(--rail);padding:6px 0 6px 12px;margin:10px 0;font-size:14.5px;display:flex;flex-direction:column;gap:2px}
.tr.good{--rail:var(--good)} .tr.ok{--rail:var(--ok)} .tr.warn{--rail:var(--warn)} .tr.bad{--rail:var(--bad)}
.tr b{color:var(--rail)}
.abs{font:400 15.5px/1.65 var(--serif);margin:0}
.muted{color:var(--muted);font-size:14px}
.box{margin-top:10px;background:var(--paper);border-radius:12px;padding:10px 12px;font-size:14.5px}
.box.cite{font:400 15px/1.6 var(--serif);max-height:42vh;overflow:auto}
.box.cite p{margin:0 0 10px} .box.cite p:last-child{margin:0}
.box pre{margin:0;white-space:pre-wrap;word-break:break-word;font:400 13px/1.5 ui-monospace,Menlo,Consolas,monospace}
.fmts{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:2px 0 6px}
.fmts::-webkit-scrollbar{display:none}
.fmts button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer}
.fmts button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.foot{display:flex;gap:8px;margin-top:18px}
.foot button{flex:1;height:48px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:15px;cursor:pointer}
.foot button.go{border:0;background:var(--accent);color:var(--on-accent);font-weight:700;padding:0}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.opt small{display:block;color:var(--muted);font-size:13px}
.opt select,.opt input[type=number]{font:400 15px var(--sans);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:48%}
.opt input[type=number]{width:110px}
.opt input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:14px;z-index:40;max-width:90vw}
@media (prefers-reduced-motion:reduce){#sheet{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><circle cx="14" cy="14" r="9" fill="none" stroke="currentColor" stroke-width="3"/><path d="M21 21l7 7" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><ellipse cx="14" cy="14" rx="3.2" ry="5.2" fill="var(--leaf)" transform="rotate(35 14 14)"/></svg>
      Jurnal Tani
    </div>
    <button id="install" type="button">Pasang</button>
  </header>

  <div class="searchbar" id="searchbar">
    <form class="s" id="sf" role="search">
      <div class="field">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Cari topik, judul, atau tempel DOI" autocomplete="off" enterkeyhint="search" aria-label="Kata kunci pencarian">
        <button type="button" id="clr" aria-label="Hapus teks" hidden>&times;</button>
      </div>
      <button class="go" id="go" type="submit">Cari</button>
    </form>
  </div>

  <main id="out" aria-live="polite"></main>
</div>

<nav class="bottom" aria-label="Menu utama">
  <button type="button" id="n-cari" data-a="tab-cari" aria-selected="true">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    Cari
  </button>
  <button type="button" id="n-simpan" data-a="tab-simpan" aria-selected="false">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
    <span id="n-simpan-t">Tersimpan</span>
  </button>
</nav>

<div id="scrim" hidden data-a="close"></div>
<section id="sheet" role="dialog" aria-modal="true" hidden></section>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

/*CITE-START*/
const PART = new Set(['van','von','de','del','della','da','di','bin','binti','al','el','le','la','dos','der','den','ter']);
function parseName(n) {
  const t = String(n || '').trim().split(/\s+/).filter(Boolean);
  if (t.length < 2) return { f: t[0] || '', g: '' };
  let i = t.length - 1;
  while (i > 1 && PART.has(t[i - 1].toLowerCase())) i--;
  return { f: t.slice(i).join(' '), g: t.slice(0, i).join(' ') };
}
const ini = (g, sp, dot) => String(g || '').split(/[\s-]+/).filter(Boolean).map(x => x[0].toUpperCase() + (dot ? '.' : '')).join(sp);
const endp = s => /[.?!]$/.test(s) ? s : s + '.';
const strip = s => s.replace(/\.\s*$/, '');
const linkOf = r => r.doi ? 'https://doi.org/' + r.doi : (r.landing || '');
const yr = r => r.year || 'n.d.';
function build(o) {
  let h = '', p = '';
  o.forEach(x => { if (typeof x === 'string') { h += esc(x); p += x; } else { h += '<i>' + esc(x.i) + '</i>'; p += x.i; } });
  return { html: h, plain: p };
}
function fApa(r) {
  const au = r.au, nm = x => x.f + (x.g ? ', ' + ini(x.g, ' ', true) : '');
  let who = '';
  if (au.length > 20) who = au.slice(0, 19).map(nm).join(', ') + ', . . . ' + nm(au[au.length - 1]);
  else if (au.length === 1) who = nm(au[0]);
  else if (au.length > 1) { const a = au.map(nm); who = a.slice(0, -1).join(', ') + (a.length > 2 ? ',' : '') + ' & ' + a[a.length - 1]; }
  const o = [];
  if (who) o.push(who + (/\.$/.test(who) ? '' : '.') + ' (' + yr(r) + '). ', endp(r.title) + ' ');
  else o.push(endp(r.title) + ' (' + yr(r) + '). ');
  if (r.venue) {
    o.push({ i: r.venue });
    if (r.vol) { o.push(', ', { i: r.vol }); if (r.issue) o.push('(' + r.issue + ')'); }
    if (r.pages) o.push(', ' + r.pages);
    o.push('. ');
  }
  o.push(linkOf(r));
  return build(o);
}
function fHarvard(r) {
  const a = r.au.map(x => x.f + (x.g ? ', ' + ini(x.g, '', true) : ''));
  const who = a.length > 3 ? a[0] + ' et al.' : a.length > 1 ? a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1] : (a[0] || 'Anon.');
  const o = [who + ' (' + yr(r) + ') \u2018' + strip(r.title) + '\u2019'];
  if (r.venue) {
    o.push(', ', { i: r.venue });
    if (r.vol) o.push(', ' + r.vol + (r.issue ? '(' + r.issue + ')' : ''));
    if (r.pages) o.push(', pp. ' + r.pages);
  }
  o.push('. Available at: ' + linkOf(r) + '.');
  return build(o);
}
function fIeee(r, n) {
  const a = r.au.map(x => (x.g ? ini(x.g, ' ', true) + ' ' : '') + x.f);
  const who = a.length > 6 ? a[0] + ' et al.' : a.length > 2 ? a.slice(0, -1).join(', ') + ', and ' + a[a.length - 1] : a.length === 2 ? a[0] + ' and ' + a[1] : (a[0] || '');
  const o = [];
  if (n) o.push('[' + n + '] ');
  o.push((who ? who + ', ' : '') + '\u201C' + strip(r.title) + ',\u201D ');
  const bits = [];
  if (r.vol) bits.push('vol. ' + r.vol);
  if (r.issue) bits.push('no. ' + r.issue);
  if (r.pages) bits.push('pp. ' + r.pages);
  bits.push(yr(r));
  if (r.doi) bits.push('doi: ' + r.doi);
  if (r.venue) o.push({ i: r.venue }, ', ');
  o.push(endp(bits.join(', ')));
  return build(o);
}
function fVan(r) {
  const a = r.au.slice(0, 6).map(x => x.f + (x.g ? ' ' + ini(x.g, '', false) : ''));
  const who = a.join(', ') + (r.au.length > 6 ? ', et al' : '');
  let s = (who ? who + '. ' : '') + endp(r.title) + ' ' + (r.venue ? r.venue + '. ' : '') + yr(r);
  if (r.vol) s += ';' + r.vol + (r.issue ? '(' + r.issue + ')' : '') + (r.pages ? ':' + r.pages.replace('\u2013', '-') : '');
  s = endp(s);
  if (r.doi) s += ' doi:' + r.doi;
  return build([s]);
}
function fMla(r) {
  const au = r.au, full = au.map(x => x.g ? x.f + ', ' + x.g : x.f);
  let who = '';
  if (au.length > 2) who = full[0] + ', et al.';
  else if (au.length === 2) who = full[0] + ', and ' + (au[1].g ? au[1].g + ' ' : '') + au[1].f;
  else if (au.length === 1) who = full[0];
  const o = [];
  if (who) o.push(who.replace(/\.?$/, '.') + ' ');
  o.push('\u201C' + endp(r.title) + '\u201D ');
  const bits = [];
  if (r.vol) bits.push('vol. ' + r.vol);
  if (r.issue) bits.push('no. ' + r.issue);
  bits.push(yr(r));
  if (r.pages) bits.push('pp. ' + r.pages);
  if (r.venue) o.push({ i: r.venue }, ', ');
  o.push(endp(bits.join(', ')) + ' ' + linkOf(r) + '.');
  return build(o);
}
function fBib(r) {
  const fam = ((r.au[0] && r.au[0].f) || 'anon').normalize('NFD').replace(/[^\w]/g, '').toLowerCase();
  const w = (r.title.match(/[A-Za-z]{4,}/) || ['x'])[0].toLowerCase();
  const L = ['@article{' + fam + (r.year || '') + w + ','];
  const F = (n, v) => { if (v) L.push('  ' + n + ' = {' + String(v).replace(/[{}]/g, '') + '},'); };
  F('author', r.au.map(x => x.g ? x.f + ', ' + x.g : x.f).join(' and '));
  L.push('  title = {{' + r.title.replace(/[{}]/g, '') + '}},');
  F('journal', r.venue); F('year', r.year); F('volume', r.vol); F('number', r.issue);
  F('pages', r.pages && r.pages.replace(/[\u2013-]+/g, '--')); F('doi', r.doi);
  L.push('}');
  return L.join('\n');
}
function fRis(r) {
  const L = ['TY  - JOUR'];
  r.au.forEach(x => L.push('AU  - ' + (x.g ? x.f + ', ' + x.g : x.f)));
  L.push('TI  - ' + r.title);
  if (r.venue) L.push('T2  - ' + r.venue);
  if (r.year) L.push('PY  - ' + r.year);
  if (r.vol) L.push('VL  - ' + r.vol);
  if (r.issue) L.push('IS  - ' + r.issue);
  if (r.fp) L.push('SP  - ' + r.fp);
  if (r.lp) L.push('EP  - ' + r.lp);
  if (r.doi) L.push('DO  - ' + r.doi);
  L.push('UR  - ' + linkOf(r), 'ER  - ');
  return L.join('\n');
}
function citation(r, fmt, n) {
  if (fmt === 'bibtex') { const t = fBib(r); return { html: '<pre>' + esc(t) + '</pre>', plain: t, code: true }; }
  if (fmt === 'ris') { const t = fRis(r); return { html: '<pre>' + esc(t) + '</pre>', plain: t, code: true }; }
  return ({ apa: fApa, harvard: fHarvard, ieee: fIeee, vancouver: fVan, mla: fMla }[fmt] || fApa)(r, n);
}
/*CITE-END*/

const FORMATS = [['apa','APA 7'],['harvard','Harvard'],['ieee','IEEE'],['vancouver','Vancouver'],['mla','MLA 9'],['bibtex','BibTeX'],['ris','RIS']];
const TOPICS = [
  { l: 'Hama dan serangga', q: 'insect pest management', d: 'Pengendalian hama' },
  { l: 'Penyakit tanaman', q: 'plant disease pathogen', d: 'Jamur, bakteri, nematoda' },
  { l: 'Gulma', q: 'weed management herbicide', d: 'Gulma dan herbisida' },
  { l: 'Agen hayati', q: 'biological control agent', d: 'Musuh alami' },
  { l: 'Pengendalian terpadu', q: 'integrated pest management', d: 'PHT' },
  { l: 'Biopestisida', q: 'biopesticide', d: 'Pestisida nabati dan hayati' },
  { l: 'Resistensi pestisida', q: 'pesticide resistance', d: 'Mekanisme dan pengelolaan' },
  { l: 'Virus tanaman', q: 'plant virus', d: 'Gejala dan vektor' }
];
const SORTS = [['relevance','Relevan'],['new','Terbaru'],['cited','Terbanyak disitasi']];
const SEL = 'id,doi,display_name,publication_year,type,cited_by_count,is_retracted,authorships,primary_location,best_oa_location,open_access,abstract_inverted_index,biblio';
const PAGE = 20;
const DOI_RE = /^\s*(?:https?:\/\/(?:dx\.)?doi\.org\/|doi:\s*)?(10\.\d{4,9}\/\S+)\s*$/i;

let st = { q: '', page: 1, items: [], total: 0, busy: false, tab: 'cari', mode: 'home', more: false, err: '', done: false, special: null, doi: false };
let saved = load('jt2-saved', {});
let hist = load('jt2-hist', []);
let curFmt = load('jt2-fmt', 'apa');
const prefs = Object.assign({ field: true, hide: true, oa: false, doaj: false, type: 'all', lang: 'all', scope: 'all', from: '', sort: 'relevance', cr: false }, load('jt2-prefs', {}));
let sheetRec = null, sheetMode = null, sheetOpen = false, curOut = { html: '', plain: '' };

const key = r => r.doi || r.id;
const find = k => st.items.find(x => key(x) === k) || saved[k];
const shortId = id => String(id || '').split('/').pop();

function abstractText(inv) {
  if (!inv) return '';
  const a = [];
  for (const [w, pos] of Object.entries(inv)) for (const p of pos) a[p] = w;
  return a.join(' ');
}
function normOA(w) {
  const src = (w.primary_location && w.primary_location.source) || {};
  const doi = w.doi ? w.doi.replace('https://doi.org/', '').toLowerCase() : '';
  const b = w.biblio || {};
  const fp = b.first_page || '', lp = b.last_page || '';
  const au = (w.authorships || []).map(a => a.author && a.author.display_name).filter(Boolean).map(parseName);
  return {
    id: w.id, doi, title: w.display_name || '(tanpa judul)', year: w.publication_year, type: w.type,
    cites: w.cited_by_count || 0, retracted: !!w.is_retracted, au,
    venue: src.display_name || '', venueType: src.type || '', doaj: !!src.is_in_doaj,
    vol: b.volume || '', issue: b.issue || '', fp, lp, pages: fp ? (lp && lp !== fp ? fp + '\u2013' + lp : fp) : '',
    oaUrl: (w.best_oa_location && (w.best_oa_location.pdf_url || w.best_oa_location.landing_page_url)) || (w.open_access && w.open_access.oa_url) || '',
    landing: (w.primary_location && w.primary_location.landing_page_url) || (doi ? 'https://doi.org/' + doi : ''),
    abstract: abstractText(w.abstract_inverted_index), src: 'OpenAlex'
  };
}
function normCR(w) {
  const doi = (w.DOI || '').toLowerCase();
  const t = ((w.title || [])[0] || '(tanpa judul)').replace(/<[^>]+>/g, '');
  const pg = String(w.page || '').split('-');
  const fp = pg[0] || '', lp = pg[1] || '';
  return {
    id: 'cr:' + doi, doi, title: t,
    year: w.issued && w.issued['date-parts'] && w.issued['date-parts'][0] && w.issued['date-parts'][0][0],
    type: 'article', cites: w['is-referenced-by-count'] || 0,
    retracted: /^(retraction|retracted|withdrawn)/i.test(t),
    au: (w.author || []).map(a => ({ g: a.given || '', f: a.family || a.name || '' })).filter(a => a.f),
    venue: (w['container-title'] || [])[0] || '', venueType: 'journal', doaj: false,
    vol: w.volume || '', issue: w.issue || '', fp, lp, pages: fp ? (lp ? fp + '\u2013' + lp : fp) : '',
    oaUrl: '', landing: w.URL || ('https://doi.org/' + doi),
    abstract: (w.abstract || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim(), src: 'Crossref'
  };
}
Object.keys(saved).forEach(k => { const r = saved[k]; if (!r || !r.au) delete saved[k]; });

function trust(r) {
  if (r.retracted) return { k: 'bad', l: 'Ditarik', t: 'Artikel ini ditarik atau berupa pemberitahuan penarikan. Jangan dijadikan rujukan.' };
  if (r.type === 'preprint' || r.venueType === 'repository') return { k: 'warn', l: 'Hati-hati', t: 'Preprint atau arsip repositori, belum tentu lolos peer review.' };
  if (!r.doi) return { k: 'warn', l: 'Hati-hati', t: 'Tidak ada DOI, jadi sulit diverifikasi.' };
  if (r.doaj) return { k: 'good', l: 'Terverifikasi', t: 'Ber-DOI, terbit di jurnal terdaftar DOAJ, dan tidak ditandai ditarik.' };
  return { k: 'ok', l: 'Ber-DOI', t: 'Terbit di jurnal dan tidak ditandai ditarik. Status DOAJ belum diketahui.' };
}

async function openAlex(page) {
  const f = [], p = new URLSearchParams({ 'per-page': String(PAGE), page: String(page), select: SEL });
  const sp = st.special;
  if (sp) {
    f.push(({ related: 'related_to:', cites: 'cites:', refs: 'cited_by:' })[sp.kind] + sp.id);
  } else {
    const q = st.q.replace(/[,|:]/g, ' ').trim();
    if (prefs.scope === 'all') p.set('search', st.q);
    else f.push((prefs.scope === 'title' ? 'title.search:' : 'title_and_abstract.search:') + q);
    if (prefs.field) f.push('primary_topic.field.id:11');
    if (prefs.lang !== 'all') f.push('language:' + prefs.lang);
  }
  if (prefs.hide) f.push('is_retracted:false');
  if (prefs.oa) f.push('open_access.is_oa:true');
  if (prefs.doaj) f.push('primary_location.source.is_in_doaj:true');
  if (prefs.from) f.push('from_publication_date:' + prefs.from + '-01-01');
  if (prefs.type === 'article') f.push('type:article|review');
  if (prefs.type === 'review') f.push('type:review');
  if (f.length) p.set('filter', f.join(','));
  if (prefs.sort === 'cited' || (sp && prefs.sort === 'relevance')) p.set('sort', 'cited_by_count:desc');
  else if (prefs.sort === 'new') p.set('sort', 'publication_date:desc');
  else if (!sp && prefs.scope !== 'all') p.set('sort', 'relevance_score:desc');
  const r = await fetch('https://api.openalex.org/works?' + p);
  if (!r.ok) throw new Error('OpenAlex ' + r.status);
  const j = await r.json();
  return { items: (j.results || []).map(normOA), total: (j.meta && j.meta.count) || 0 };
}
async function crossref(page) {
  const p = new URLSearchParams({
    'query.bibliographic': st.q, rows: String(PAGE), offset: String((page - 1) * PAGE),
    select: 'DOI,title,author,issued,container-title,is-referenced-by-count,URL,abstract,volume,issue,page',
    filter: 'type:journal-article' + (prefs.from ? ',from-pub-date:' + prefs.from : '')
  });
  if (prefs.sort === 'cited') { p.set('sort', 'is-referenced-by-count'); p.set('order', 'desc'); }
  if (prefs.sort === 'new') { p.set('sort', 'issued'); p.set('order', 'desc'); }
  const r = await fetch('https://api.crossref.org/works?' + p);
  if (!r.ok) throw new Error('Crossref ' + r.status);
  const j = await r.json();
  return { items: ((j.message && j.message.items) || []).map(normCR), total: 0 };
}
async function lookupDoi(doi) {
  try {
    const r = await fetch('https://api.openalex.org/works/doi:' + encodeURI(doi) + '?select=' + SEL);
    if (r.ok) return normOA(await r.json());
  } catch (e) {}
  const r = await fetch('https://api.crossref.org/works/' + encodeURIComponent(doi));
  if (!r.ok) throw new Error('nf');
  return normCR((await r.json()).message);
}

function pushHist(q) {
  hist = [q].concat(hist.filter(x => x !== q)).slice(0, 8);
  store('jt2-hist', hist);
}

async function search(reset) {
  if (st.busy) return;
  if (reset) {
    const q = $('#q').value.trim();
    if (!q && !st.special) return;
    if (!st.special) { st.q = q; pushHist(q); }
    st.page = 1; st.items = []; st.total = 0; st.done = false; st.err = ''; st.doi = false; st.mode = 'results';
    window.scrollTo(0, 0);
  } else st.page++;
  st.tab = 'cari'; st.busy = true; render();
  const m = !st.special && DOI_RE.exec(st.q);
  if (m) {
    try { const rec = await lookupDoi(m[1].replace(/[).,;]+$/, '')); st.items = [rec]; st.total = 1; st.doi = true; }
    catch (e) { st.err = 'DOI tidak ditemukan di OpenAlex maupun Crossref. Periksa lagi penulisannya. '; }
    st.more = false; st.done = true; st.busy = false; render(); return;
  }
  const jobs = [openAlex(st.page)];
  if (prefs.cr && !st.special) jobs.push(crossref(st.page));
  const res = await Promise.allSettled(jobs);
  let fresh = [];
  res.forEach((r, i) => {
    if (r.status === 'fulfilled') { fresh = fresh.concat(r.value.items); if (i === 0) st.total = r.value.total; }
    else st.err += (i === 0 ? 'OpenAlex' : 'Crossref') + ' tidak merespons. ';
  });
  const seen = new Set(st.items.map(key));
  fresh.forEach(x => { const k = key(x); if (k && !seen.has(k)) { seen.add(k); st.items.push(x); } });
  if (prefs.hide) st.items = st.items.filter(x => !x.retracted);
  st.more = res[0].status === 'fulfilled' && res[0].value.items.length === PAGE;
  st.done = true; st.busy = false; render();
}

function nFilters() {
  let n = 0;
  if (!prefs.field) n++; if (!prefs.hide) n++; if (prefs.oa) n++; if (prefs.doaj) n++;
  if (prefs.type !== 'all') n++; if (prefs.lang !== 'all') n++; if (prefs.scope !== 'all') n++;
  if (prefs.from) n++; if (prefs.cr) n++;
  return n;
}

function card(r) {
  const t = trust(r), k = key(r);
  const au = r.au.length ? r.au.slice(0, 3).map(a => a.g ? a.g + ' ' + a.f : a.f).join(', ') + (r.au.length > 3 ? ' dkk.' : '') : 'Penulis tidak tercantum';
  const isSaved = !!saved[k];
  return `<article class="res ${t.k}" data-k="${esc(k)}">
    <h3><button type="button" data-a="detail">${esc(r.title)}</button></h3>
    <p class="meta"><span>${esc(au)}</span><span>${esc(r.year || 'tahun tidak diketahui')}</span>${r.venue ? `<i>${esc(r.venue)}</i>` : ''}</p>
    <p class="status"><b>${t.l}</b>${r.oaUrl ? '<span>Open access</span>' : ''}${r.doaj ? '<span>DOAJ</span>' : ''}<span>${r.cites} sitasi</span></p>

}

  }
  if (st.mode === 'home') {
    h = `<section class="hero"><h1>Temukan jurnal pertanian yang bisa dipercaya</h1>

  if (st.special) {

    <button type="button" class="fbtn" data-a="filter"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Saring${nf ? ' (' + nf + ')' : ''}</button></div>`;
  if (!st.doi) h += `<div class="sorts" role="group" aria-label="Urutan">${SORTS.map(s => `<button type="button" data-a="sort" data-s="${s[0]}" aria-pressed="${prefs.sort === s[0]}">${s[1]}</button>`).join('')}</div>`;

async function verify(r) {
  const box = $('#sheet [data-box=doi]'); if (!box) return;
  box.hidden = false; box.textContent = 'Memeriksa DOI di Crossref\u2026';
  try {
    const res = await fetch('https://api.crossref.org/works/' + encodeURIComponent(r.doi));
    if (res.status === 404) { box.innerHTML = '<b>DOI tidak ditemukan di Crossref.</b> Bisa jadi terdaftar di agen DOI lain, atau DOI-nya keliru. Coba buka doi.org untuk memastikan.'; return; }
    if (!res.ok) throw new Error(res.status);
    const m = (await res.json()).message;
    const upd = m['updated-by'] || [];
    const bad = upd.filter(u => /retraction|withdrawal|removal/i.test(u.type || ''));
    const concern = upd.filter(u => /concern/i.test(u.type || ''));
    let s = 'DOI terdaftar di Crossref. Penerbit: ' + esc(m.publisher || 'tidak disebutkan') + '.';
    if (bad.length) s += ' <b style="color:var(--bad)">Ada catatan penarikan resmi untuk artikel ini.</b>';
    else if (concern.length) s += ' <b style="color:var(--warn)">Ada pernyataan kekhawatiran (expression of concern) dari penerbit.</b>';
    else s += ' Tidak ada catatan penarikan di Crossref.';
    box.innerHTML = s;
  } catch (e) { box.textContent = 'Gagal memeriksa. Cek koneksi internet lalu coba lagi.'; }
}

async function copyRich(html, plain) {
  try {
    if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
      await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }), 'text/plain': new Blob([plain], { type: 'text/plain' }) })]);
      toast('Sitasi disalin'); return;
    }
  } catch (e) {}
  try { await navigator.clipboard.writeText(plain); toast('Sitasi disalin'); }
  catch (e) { window.prompt('Salin sitasi ini:', plain); }
}
function download(name, text) {
  const b = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const u = URL.createObjectURL(b), a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 2000);
}
function readFilters() {
  const g = id => $('#' + id);
  prefs.scope = g('f-scope').value; prefs.lang = g('f-lang').value; prefs.type = g('f-type').value;
  prefs.from = g('f-from').value.trim(); prefs.field = g('f-field').checked; prefs.doaj = g('f-doaj').checked;
  prefs.oa = g('f-oa').checked; prefs.hide = g('f-hide').checked; prefs.cr = g('f-cr').checked;
  store('jt2-prefs', prefs);
}
function startSpecial(kind, r) {
  st.special = { kind, id: shortId(r.id), title: r.title };
  closeSheet();
  setTimeout(() => { st.tab = 'cari'; search(true); }, 60);
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a;
  const host = b.closest('[data-k]');
  const r = host ? find(host.dataset.k) : sheetRec;
  switch (a) {
    case 'tab-cari': st.tab = 'cari'; render(); break;
    case 'tab-simpan': st.tab = 'simpan'; render(); window.scrollTo(0, 0); break;
    case 'topic': $('#q').value = TOPICS[+b.dataset.i].q; st.special = null; search(true); break;
    case 'hist': $('#q').value = hist[+b.dataset.i]; st.special = null; search(true); break;
    case 'clearhist': hist = []; store('jt2-hist', hist); render(); break;
    case 'more': search(false); break;
    case 'sort': prefs.sort = b.dataset.s; store('jt2-prefs', prefs); search(true); break;
    case 'filter': filterSheet(); break;
    case 'applyfilter': readFilters(); closeSheet(); if (st.q || st.special) setTimeout(() => search(true), 60); else render(); break;
    case 'resetfilter': Object.assign(prefs, { field: true, hide: true, oa: false, doaj: false, type: 'all', lang: 'all', scope: 'all', from: '', cr: false }); store('jt2-prefs', prefs); filterSheet(); break;
    case 'endspecial': st.special = null; st.mode = st.q ? 'results' : 'home'; if (st.q) search(true); else render(); break;
    case 'detail': if (r) detailSheet(r); break;
    case 'cite': if (r) citeSheet(r, false); break;
    case 'fmt': curFmt = b.dataset.f; store('jt2-fmt', curFmt); citeSheet(null, sheetMode && sheetMode.bulk); break;
    case 'copycite': copyRich(curOut.html, curOut.plain); break;
    case 'dl': download((sheetMode && sheetMode.bulk ? 'daftar-pustaka' : 'sitasi') + b.dataset.ext, curOut.plain); break;
    case 'export': citeSheet(null, true); break;
    case 'clearsaved': if (confirm('Hapus semua artikel tersimpan?')) { saved = {}; store('jt2-saved', saved); render(); } break;
    case 'save': {
      if (!r) break;
      const k = key(r);
      if (saved[k]) { delete saved[k]; toast('Dihapus dari tersimpan'); } else { saved[k] = r; toast('Tersimpan'); }
      store('jt2-saved', saved);
      if (b.closest('#sheet')) b.textContent = saved[k] ? 'Tersimpan' : 'Simpan';
      render(); break;
    }
    case 'doi': if (r) verify(r); break;
    case 'share': if (r) { const u = linkOf(r); if (navigator.share) navigator.share({ title: r.title, url: u }).catch(() => {}); else copyRich(esc(u), u); } break;
    case 'related': case 'cites': case 'refs': if (r) startSpecial(a, r); break;
    case 'close': closeSheet(); break;
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

$('#sf').addEventListener('submit', e => { e.preventDefault(); st.special = null; search(true); });
$('#q').addEventListener('input', () => { $('#clr').hidden = !$('#q').value; });
$('#clr').addEventListener('click', () => { $('#q').value = ''; $('#clr').hidden = true; $('#q').focus(); });

let deferred;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; $('#install').style.display = 'block'; });
$('#install').addEventListener('click', async () => {
  if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; $('#install').style.display = 'none';
});
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
render();
})();
</script>
